id = "zee-sh.pane-title"
name = "pane-title"
version = "0.1.0"
min_herdr_version = "0.9.0"
platforms = ["macos", "linux"]
description = "Label each agent pane's border with the agent's session name."

# Skipped by `herdr plugin link`; run `make build` for a local checkout.
# herdr runs builds with a minimal PATH, so add the usual Go install locations.
[[build]]
command = ["sh", "-c", "PATH=\"$PATH:/opt/homebrew/bin:/usr/local/go/bin:/etc/profiles/per-user/$USER/bin:/run/current-system/sw/bin:$HOME/.nix-profile/bin\" go build -o bin/herdr-pane-title ."]

# Label every live agent once the server is up (not run on `plugin link`/`enable`).
[[startup]]
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-pane-title\""]

# Fires on every agent turn. pane.agent_detected is skipped on purpose: at detection the
# terminal title can still be the shell's or launcher's, and a status change follows anyway.
[[events]]
on = "pane.agent_status_changed"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-pane-title\""]

# Manual re-sweep of every agent pane (bind via [[keys.command]] type = "plugin_action").
[[actions]]
id = "refresh"
title = "pane-title: refresh all agent panes"
contexts = ["pane"]
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-pane-title\""]
